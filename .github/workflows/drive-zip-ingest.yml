name: Drive ChatGPT stock archive ingest

on:
  push:
    paths:
      - .github/workflows/drive-zip-ingest.yml
      - ingest/RUN
      - ingest/ingest_chatgpt_stock.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gpt-stock-archive-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-chi-sim poppler-utils p7zip-full > /dev/null
          sudo mkdir -p /mnt/work && sudo chown -R "$(id -u):$(id -g)" /mnt/work || true
          df -h / /mnt | sed -n 1,3p
      - name: Python dependencies
        run: python -m pip install -q requests gdown python-docx openpyxl xlrd pdfplumber pypdf python-pptx pillow beautifulsoup4
      - name: Load RUN
        run: grep -E '^[A-Z_][A-Z0-9_]*=' ingest/RUN >> "$GITHUB_ENV"
      - name: Download, decode and archive stock conversations
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_REF: ${{ github.ref_name }}
          WORK_DIR: /mnt/work
        run: |
          git config user.name "ingest[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python ingest/ingest_chatgpt_stock.py
      - name: Final commit and push
        if: always()
        run: |
          git add --all -- "GPT股票记录入库"
          git commit -q -m "GPT股票记录入库: 收尾 $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing to commit"; exit 0; }
          git pull -q --rebase -X theirs origin "${{ github.ref_name }}" || true
          git push -q origin "HEAD:${{ github.ref_name }}"
